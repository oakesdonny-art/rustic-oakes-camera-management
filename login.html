<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rustic Oakes Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0c1110, #171d19);
      color: white;
    }

    body {
      min-height: 100vh;
      overflow-y: auto;
      padding: 30px 18px 50px;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      background: #171d1a;
      border: 1px solid #354239;
      border-radius: 22px;
      padding: 28px 24px 32px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
    }

    .logo {
      width: 125px;
      max-width: 50%;
      height: auto;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #aeb9b0;
      font-size: 14px;
    }

    .field {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #d6ddd8;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #46554b;
      background: #0e1411;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #8ea98f;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: #667f63;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .forgot {
      display: inline-block;
      margin-top: 18px;
      color: #aeb9b0;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      margin-top: 24px;
      padding: 0 8px;
      color: #718078;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <img
      src="rustic-oakes-logo.png"
      alt="Rustic Oakes Tree"
      class="logo"
    >

    <h1>RUSTIC OAKES</h1>
    <div class="subtitle">Camera Management Portal</div>

    <form onsubmit="login(event)">

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >
      </div>

      <button type="submit">LOG IN</button>

    </form>

    <a href="#" class="forgot">Forgot password?</a>

    <div class="footer">
      Good people, wild places, and better days.
    </div>

  </div>

  <script>
    function login(event) {
      event.preventDefault();
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
